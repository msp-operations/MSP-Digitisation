<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSP Digital Hub</title>
<meta name="description" content="Every Maastricht Science Programme web tool in one place.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#011B3C">
<link rel="icon" type="image/png" href="msp-ui/favicon.png">
<link rel="stylesheet" href="msp-ui/msp-ui.css">
<style>
  /* The front door: one navy page, a short heading and the tools as cards. The cards come from
     projects.js; a tool's `card` and `mark` fields pick its shape. No sidebar here on purpose;
     each tool opens in the shared sidebar layout. index.html and staff.html are the same file
     apart from the title and window.MSP_HUB. */
  body{margin:0;font-family:var(--msp-font);color:#fff;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 70% 60% at 50% 0%, rgba(110,210,236,.08) 0%, rgba(110,210,236,0) 60%),
      radial-gradient(ellipse 120% 90% at 50% 0%, #0A3060 0%, #02274F 38%, #011B3C 75%);
    background-color:#011B3C;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
  a{color:inherit}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 44px;box-sizing:border-box}

  /* top and bottom bars */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:26px;padding-bottom:26px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
  .brand img{view-transition-name:msp-emblem;width:34px;height:34px;filter:brightness(0) invert(1);opacity:.95;display:block}
  .brand .name{font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
  .kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--msp-sky);padding:4px 10px;border:1px solid rgba(110,210,236,.35);border-radius:999px;white-space:nowrap}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.8);text-decoration:none;padding:9px 16px;border:1px solid rgba(255,255,255,.2);border-radius:999px;transition:all .2s;white-space:nowrap}
  .switch:hover,.switch:focus-visible{background:#fff;color:var(--msp-navy);border-color:#fff;outline:none}
  .switch svg{width:14px;height:14px}
  .foot{padding-top:40px;padding-bottom:28px;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.02em}

  /* heading */
  .hero{padding-top:30px}
  .hero h1{font-family:var(--msp-font-display);font-weight:700;font-size:56px;line-height:1.04;letter-spacing:-.03em;margin:0}
  .hero p{margin:14px 0 0;max-width:760px;font-size:15px;line-height:1.6;color:rgba(255,255,255,.65)}

  /* the cards */
  .grid{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:minmax(196px,auto);grid-auto-flow:row dense;gap:16px;margin-top:34px}
  body.staff .grid{--cols:3}
  .card{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:18px;text-decoration:none;color:#fff;overflow:hidden;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);
    transition:background .25s,border-color .25s,transform .25s,box-shadow .25s}
  a.card:hover,a.card:focus-visible,.card.search:focus-within{background:rgba(255,255,255,.075);border-color:rgba(110,210,236,.5);box-shadow:0 14px 34px rgba(0,0,0,.25);outline:none}
  a.card:hover,a.card:focus-visible{transform:translateY(-2px)}
  .card .ic{width:22px;height:22px;color:rgba(255,255,255,.82)}
  .card .ic svg{width:22px;height:22px;display:block}
  .card h2{font-family:var(--msp-font-display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.25}
  .card p{margin:0;font-size:13px;line-height:1.55;color:rgba(255,255,255,.62)}
  .card .end{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .card .cta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;text-decoration:none}
  .card .cta svg{width:14px;height:14px;transition:transform .2s}
  .card:hover .cta svg,.cta:hover svg{transform:translateX(3px)}
  .card .soon{position:absolute;top:18px;right:18px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 8px}
  .card.is-soon{opacity:.5}

  /* wide card with a search box */
  .card.search{grid-column:span 2}
  .card.search .top{display:flex;align-items:center;gap:12px}
  .card.search .top .cta{margin-left:auto;color:var(--msp-sky)}
  .card.search form{margin-top:auto;display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2)}
  .card.search form:focus-within{border-color:var(--msp-sky)}
  .card.search form svg{width:16px;height:16px;color:rgba(255,255,255,.55);flex-shrink:0}
  .card.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font:inherit;font-size:14px;padding:8px 0}
  .card.search input::placeholder{color:rgba(255,255,255,.45)}
  .card.search button{border:0;border-radius:9px;background:var(--msp-sky);color:var(--msp-navy);font:inherit;font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer}
  .card.search button:hover,.card.search button:focus-visible{background:#fff;outline:none}

  /* tall light card with a small picture */
  .card.tall{grid-row:span 2;background:var(--msp-sky);border-color:var(--msp-sky);color:var(--msp-navy)}
  a.card.tall:hover,a.card.tall:focus-visible{background:#8ADCF1;border-color:#fff}
  .card.tall .ic{color:var(--msp-navy)}
  .card.tall p{color:rgba(1,27,60,.72)}
  .card.tall .pic{margin:14px 0 4px;border-radius:12px;background:rgba(255,255,255,.55);padding:12px}
  .card.tall .pic svg{display:block;width:100%;height:auto}
  .card.tall .cta{color:var(--msp-navy)}

  /* a big word instead of the icon */
  .card .mark{font-family:var(--msp-font-display);font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--msp-orange)}

  /* dotted corner on plain cards, every other one */
  .card.dots::after{content:'';position:absolute;top:0;right:0;width:46%;height:52%;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.4px);background-size:11px 11px;
    -webkit-mask-image:linear-gradient(225deg,#000 0%,transparent 70%);mask-image:linear-gradient(225deg,#000 0%,transparent 70%)}

  /* the contact card */
  .card.contact{background:transparent;border:1.5px dashed rgba(255,255,255,.28)}
  .card.contact .ic{color:var(--msp-orange)}
  .card.contact a{color:var(--msp-sky);font-size:12.5px;font-weight:600;word-break:break-all}
  .card.contact a:hover{color:#fff}

  @media (max-width:1100px){
    .grid,body.staff .grid{--cols:2}
    .hero h1{font-size:46px}
  }
  @media (max-width:640px){
    .wrap{padding-left:16px;padding-right:16px}
    .bar{padding-top:18px;padding-bottom:18px}
    .brand .name{display:none}
    .hero{padding-top:14px}
    .hero h1{font-size:36px}
    .hero p{font-size:14px}
    .grid,body.staff .grid{--cols:1;grid-auto-rows:auto;margin-top:24px;gap:12px}
    .card.search,.card.tall{grid-column:auto;grid-row:auto}
    .card{min-height:150px}
    .card.tall .pic{max-width:300px}
  }
  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .card.is-soon{animation-name:riseSoon}
    @keyframes riseSoon{from{opacity:0;transform:translateY(10px)}to{opacity:.5;transform:none}}
  }
</style>
</head>
<body>

<header class="wrap bar">
  <a class="brand" href="#" id="home">
    <img src="msp-ui/msp-emblem.png" alt="">
    <span class="name">Maastricht Science Programme</span>
    <span class="kicker" id="kicker"></span>
  </a>
  <a class="switch" id="switch" href="#"></a>
</header>

<main class="wrap">
  <section class="hero">
    <h1>MSP Digital Hub</h1>
    <p id="line"></p>
  </section>
  <nav class="grid" id="grid" aria-label="MSP tools"></nav>
</main>

<footer class="wrap foot">Maastricht Science Programme · Faculty of Science and Engineering · Maastricht University</footer>

<script>window.MSP_HUB = 'students';</script>
<script src="projects.js"></script>
<script src="msp-ui/msp-shell.js"></script>
<script>
(function () {
  var HUBKEY = window.MSP_HUB || 'students';
  if (MSPShell.rememberSuite) MSPShell.rememberSuite(HUBKEY);
  var HUB = (window.MSP_HUBS || {})[HUBKEY] || { title: '', line: '' };
  var P = (window.MSP_PROJECTS || []).filter(function (p) { return (p.hubs || []).indexOf(HUBKEY) >= 0; });
  var FEEDBACK = 'msp-digital@maastrichtuniversity.nl';
  document.body.classList.add(HUBKEY);
  document.getElementById('kicker').textContent = HUB.title;
  document.getElementById('line').textContent = HUB.line;
  document.getElementById('home').href = HUB.file || 'index.html';
  var sw = document.getElementById('switch'), other = (window.MSP_HUBS || {})[HUB.other];
  if (other) { sw.href = other.file; sw.innerHTML = HUB.otherLabel + ' ' + ARROW(); } else { sw.remove(); }

  function ARROW() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function blurb(p) { return (HUBKEY === 'staff' && p.blurbStaff) || p.blurb; }

  // small pictures for the tall cards: a week of course blocks, or a month
  function picture(p) {
    var navy = '#011B3C', slate = '#8DB4CB', orange = '#E87722', s = '';
    if (p.icon === 'clock') {
      s += ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (d, i) { return '<text x="' + (16 + i * 28) + '" y="12" font-size="9" font-weight="700" text-anchor="middle" fill="' + navy + '" opacity=".7">' + d + '</text>'; }).join('');
      var due = { 3: navy, 9: navy, 12: orange, 18: navy, 24: navy, 26: navy, 31: navy };
      for (var r = 0; r < 5; r++) for (var c = 0; c < 7; c++) {
        var n = r * 7 + c;
        s += '<rect x="' + (5 + c * 28) + '" y="' + (20 + r * 25) + '" width="22" height="19" rx="5" fill="' + (due[n] || slate) + '"' + (due[n] ? '' : ' opacity=".45"') + '/>';
      }
      return '<svg viewBox="0 0 200 145" role="img" aria-label="">' + s + '</svg>';
    }
    var blocks = [[0, 0, 34, navy], [0, 44, 22, slate], [0, 98, 18, navy],
                  [1, 0, 18, slate], [1, 26, 34, navy], [1, 70, 22, slate], [1, 104, 16, slate],
                  [2, 0, 22, navy], [2, 30, 20, slate], [2, 64, 26, orange],
                  [3, 8, 30, navy], [3, 52, 20, slate],
                  [4, 0, 20, slate], [4, 26, 30, navy]];
    s += ['M', 'T', 'W', 'T', 'F'].map(function (d, i) { return '<text x="' + (20 + i * 40) + '" y="12" font-size="9" font-weight="700" text-anchor="middle" fill="' + navy + '" opacity=".7">' + d + '</text>'; }).join('');
    blocks.forEach(function (b) { s += '<rect x="' + (4 + b[0] * 40) + '" y="' + (20 + b[1]) + '" width="32" height="' + b[2] + '" rx="5" fill="' + b[3] + '"/>'; });
    return '<svg viewBox="0 0 200 145" role="img" aria-label="">' + s + '</svg>';
  }

  var grid = document.getElementById('grid'), plain = 0;
  P.forEach(function (p, i) {
    var href = (HUBKEY === 'staff' && p.nextStaff) || p.next || p.live, soon = p.status === 'dev' || !href;
    var kind = p.card === 'search' && !soon ? 'search' : p.card === 'tall' ? 'tall' : '';
    var el = document.createElement(kind === 'search' || soon ? 'div' : 'a');
    el.className = 'card' + (kind ? ' ' + kind : '') + (soon ? ' is-soon' : '');
    if (!kind && !p.mark && (plain++ % 2 === 1)) el.className += ' dots';
    if (el.tagName === 'A') el.href = href;
    el.style.animationDelay = (0.05 * i) + 's';
    var icon = '<span class="ic">' + MSPShell.icon(p.icon) + '</span>';
    var name = '<h2>' + esc(p.name) + '</h2>', text = '<p>' + esc(blurb(p)) + '</p>';
    var cta = p.cta ? '<span class="cta">' + esc(p.cta) + ' ' + ARROW() + '</span>' : '';
    if (kind === 'search') {
      el.innerHTML = '<div class="top">' + icon + name + '<a class="cta" href="' + esc(href) + '">' + esc(p.cta || 'Open') + ' ' + ARROW() + '</a></div>' + text +
        '<form action="' + esc(href) + '" method="get" role="search">' + MSPShell.icon('search') +
        '<input name="q" type="search" placeholder="Ask a question: resit, registration, thesis..." aria-label="Search the ' + esc(p.name) + '" autocomplete="off">' +
        '<button type="submit">Search</button></form>';
    } else if (kind === 'tall') {
      el.innerHTML = icon + name + text + '<div class="pic" aria-hidden="true">' + picture(p) + '</div><div class="end">' + cta + '</div>';
    } else {
      el.innerHTML = (p.mark ? '<span class="mark">' + esc(p.mark) + '</span>' : icon) + '<div class="end">' + name + text + '</div>';
    }
    if (soon) el.insertAdjacentHTML('beforeend', '<span class="soon">Soon</span>');
    grid.appendChild(el);
  });

  var c = document.createElement('div');
  c.className = 'card contact';
  c.innerHTML = '<span class="ic">' + MSPShell.icon('mail') + '</span><div class="end"><h2>Something not working?</h2>' +
    '<p>Tell the team that builds these tools.</p><a href="mailto:' + FEEDBACK + '">' + FEEDBACK + '</a></div>';
  grid.appendChild(c);
})();
</script>
</body>
</html>
